  <path d="M18 20C18 16.6863 20.6863 14 24 14H40C43.3137 14 46 16.6863 46 20V32C46 35.3137 43.3137 38 40 38H29L20 46V38H24C20.6863 38 18 35.3137 18 32V20Z" fill="#FFFFFF"/>
