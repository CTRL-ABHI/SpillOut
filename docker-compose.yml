version: '3.8'

services:
  # 1. Persistent Account Database (NO chat messages stored here)
  postgres:
    image: postgres:16-alpine
    container_name: spillout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spillout
      POSTGRES_PASSWORD: spillout_production_secret_change_me
      POSTGRES_DB: spillout
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spillout -d spillout"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Ephemeral In-Memory Coordination (Zero disk snapshots or append-only persistence)
  redis:
    image: redis:7-alpine
    container_name: spillout-redis
    restart: unless-stopped
    # CRITICAL: Disable all RDB snapshots and append-only persistence to maintain ephemeral guarantees
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. SPILLOUT Backend API & WebSocket Server
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: spillout-server
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: "postgresql://spillout:spillout_production_secret_change_me@postgres:5432/spillout?schema=public"
      REDIS_URL: "redis://redis:6379"
      CLIENT_ORIGIN: "http://localhost:3000"
      COOKIE_SECRET: "spillout_production_super_secret_cookie_signing_key_32chars"
      SESSION_TTL_HOURS: 168
      INACTIVITY_EXPIRATION_DAYS: 7
      INACTIVITY_CHECK_INTERVAL_MS: 3600000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. SPILLOUT Frontend Web Client (Next.js 14)
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: spillout-client
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_API_URL: "http://server:4000/api"
      NEXT_PUBLIC_WS_URL: "ws://localhost:4000/ws"
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  postgres_data:
